[package]
name = "Trader"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
chrono = "0.4"
env_logger = "0.11"
hex = "0.4.3"
hmac = "0.13"
log = "0.4"
mysql = { version = "28", features = ["chrono"] }
reqwest = { version = "0.13", features = ["query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "1"
